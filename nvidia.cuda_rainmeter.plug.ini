[Rainmeter]
Author=Subhajit
AppVersion=100100
Update=1000


[Variables]
fontName=Trebuchet MS
textSize=8
colorText=255,255,255,205

colorBarLoad=255,242,0,255
colorBarMem=141,198,63,255
colorBarTotal=0,174,239,255

graphH=42

; Total dedicated VRAM of your card in bytes.
; 4 GB = 4294967296 | 6 GB = 6442450944 | 8 GB = 8589934592 | 12 GB = 12884901888
VRAMTotal=6442450944

; Shared GPU memory limit (system RAM the GPU may borrow), in bytes.
; Check Task Manager > Performance > GPU > "Shared GPU memory".
; 8 GB = 8589934592 | 12 GB = 12884901888 | 16 GB = 17179869184
SharedTotal=12884901888

; ----------------------------------
; MEASURES (UsageMonitor)
; ----------------------------------

[ActivityRaw]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0

[Activity]
Measure=Calc
Formula=(ActivityRaw > 100 ? 100 : ActivityRaw)
MinValue=0
MaxValue=100

[MemoryLoadRaw]
Measure=Plugin
Plugin=UsageMonitor
Alias=VRAM
Index=0

[MemoryLoad]
Measure=Calc
Formula=MemoryLoadRaw
MinValue=0
MaxValue=#VRAMTotal#

; Dedicated VRAM capacity, used for the "usage / 6.0 GB" text
[VRAMCapacity]
Measure=Calc
Formula=#VRAMTotal#

; Shared (system RAM) usage.
; NOTE: the alias name may differ by plugin version. If this stays at 0,
; check the UsageMonitor docs for the shared / non-local GPU memory alias.
[SharedLoadRaw]
Measure=Plugin
Plugin=UsageMonitor
Alias=SharedVRAM
Index=0

[SharedLoad]
Measure=Calc
Formula=SharedLoadRaw
MinValue=0
MaxValue=#SharedTotal#

; Total capacity = dedicated + shared (the "18 GB" in Task Manager)
[TotalAvailable]
Measure=Calc
Formula=#VRAMTotal# + #SharedTotal#

; Combined usage, scaled against total capacity so the chart/bar fill correctly
[TotalUsed]
Measure=Calc
Formula=MemoryLoad + SharedLoad
MinValue=0
MaxValue=(#VRAMTotal# + #SharedTotal#)

; ----------------------------------
; STYLES
; ----------------------------------

[styleTitle]
StringAlign=CENTER
StringCase=UPPER
StringEffect=SHADOW
FontEffectColor=0,0,0,40
FontColor=#colorText#
FontFace=#fontName#
FontSize=12
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=LEFT
StringCase=NONE
StringEffect=SHADOW
FontEffectColor=0,0,0,40
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=RIGHT
StringCase=NONE
StringEffect=SHADOW
FontEffectColor=0,0,0,40
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBarLoad]
BarColor=#colorBarLoad#
BarOrientation=Vertical
SolidColor=0,0,0,50

[styleBarMem]
BarColor=#colorBarMem#
BarOrientation=Vertical
SolidColor=0,0,0,50

[styleBarTotal]
BarColor=#colorBarTotal#
BarOrientation=Vertical
SolidColor=0,0,0,50

; ----------------------------------
; METERS
; ----------------------------------

[meterHeader]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\Header.png
X=0
Y=0
H=50
W=180

; Body height raised from 125 to 190 to fit the extra Total block
[meterBody]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\Body.png
Tile=1
X=0r
Y=0R
H=190
W=180

[meterFooter]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\Footer.png
X=0
Y=0R
H=38
W=180

[meterTitle]
Meter=STRING
MeterStyle=styleTitle
X=90
Y=15
W=180
H=20
Text="GPU"

; ----- Load -----

[MeterLabelGPULoad]
Meter=STRING
MeterStyle=styleLeftText
X=15
Y=15R
W=145
H=14
Text="Load"

[MeterGPULoad]
Meter=STRING
MeterStyle=styleRightText
MeasureName=Activity
X=165
Y=0r
W=145
H=14
NumOfDecimals=0
Text="%1 %"

[meterHLGraphBG4]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\Graphbg.png
X=15
Y=2R
H=#graphH#
W=137

[GPULoadGraphLine]
Meter=Line
MeasureName=Activity
LineColor=#colorBarLoad#
MeterStyle=styleBarLoad
X=1r
Y=1r
H=(#graphH# - 2)
W=135
LineWidth=1
LineCount=1
AntiAlias=1

[meterHLBarGPU4BG]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\CoreBG.png
X=2R
Y=-1r
H=#graphH#
W=12

[meterBarGPULoad]
Meter=BAR
MeterStyle=styleBarLoad
MeasureName=Activity
X=0r
Y=0r
Barimage=#SKINSPATH#\SystemInformation\img\Core2f.png
W=12
H=#graphH#

; ----- Memory (dedicated) -----

[MeterLabelGPUMem]
Meter=STRING
MeterStyle=styleLeftText
X=15
Y=2R
W=145
H=14
Text="Memory"

[MeterGPUMem]
Meter=STRING
MeterStyle=styleRightText
MeasureName=MemoryLoad
MeasureName2=VRAMCapacity
AutoScale=1
NumOfDecimals=1
X=165
Y=0r
W=145
H=14
Text="%1B / %2B"

[meterHLGraphBG5]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\Graphbg.png
X=15
Y=2R
H=#graphH#
W=137

[GPUMemGraphLine]
Meter=Line
MeasureName=MemoryLoad
LineColor=#colorBarMem#
MeterStyle=styleBarMem
X=1r
Y=1r
H=(#graphH# - 2)
W=135
LineWidth=1
LineCount=1
AntiAlias=1

[meterHLBarGPU5BG]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\CoreBG.png
X=2R
Y=-1r
H=#graphH#
W=12

[meterBarGPUMem]
Meter=BAR
MeterStyle=styleBarMem
MeasureName=MemoryLoad
X=0r
Y=0r
Barimage=#SKINSPATH#\SystemInformation\img\Core1f.png
W=12
H=#graphH#

; ----- Total (dedicated + shared) -----

[MeterLabelGPUTotal]
Meter=STRING
MeterStyle=styleLeftText
X=15
Y=2R
W=145
H=14
Text="Shared"

; Shows used / total capacity, e.g. "2.1 GB / 18.0 GB"
[MeterGPUTotal]
Meter=STRING
MeterStyle=styleRightText
MeasureName=TotalUsed
MeasureName2=TotalAvailable
AutoScale=1
NumOfDecimals=1
X=165
Y=0r
W=145
H=14
Text="%1B / %2B"

[meterHLGraphBG6]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\Graphbg.png
X=15
Y=2R
H=#graphH#
W=137

[GPUTotalGraphLine]
Meter=Line
MeasureName=TotalUsed
LineColor=#colorBarTotal#
MeterStyle=styleBarTotal
X=1r
Y=1r
H=(#graphH# - 2)
W=135
LineWidth=1
LineCount=1
AntiAlias=1

[meterHLBarGPU6BG]
Meter=IMAGE
ImageName=#SKINSPATH#\SystemInformation\img\CoreBG.png
X=2R
Y=-1r
H=#graphH#
W=12

[meterBarGPUTotal]
Meter=BAR
MeterStyle=styleBarTotal
MeasureName=TotalUsed
X=0r
Y=0r
Barimage=#SKINSPATH#\SystemInformation\img\Core1f.png
W=12
H=#graphH#